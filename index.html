<title>Plán 70 kg</title>
<style>
/* Layout: iOS 26 app shell per Apple HIG — large title that collapses into a glass nav bar, inset-grouped lists (26pt corners, 52pt rows, 16pt margins),
   floating Liquid Glass tab bar (inset 21pt), sheets with grabber. System colors; SF Pro via -apple-system; Dynamic Type via -apple-system-body. */
:root {
  /* iOS system colors (light). Secondary label darkened from .60 to .74 alpha to reach WCAG 4.5:1. */
  --bg: #F2F2F7; --card: #FFFFFF; --card-2: #F2F2F7; --label: #000000; --label-2: rgba(60,60,67,.74); --label-3: rgba(60,60,67,.42);
  --sep: rgba(60,60,67,.29); --fill: rgba(120,120,128,.20); --fill-2: rgba(120,120,128,.16); --fill-3: rgba(118,118,128,.12); --press: #D1D1D6;
  --tint: #FF9500; --tint-text: #C93400; --on-tint: #000000;
  --green: #34C759; --green-ui: #248A3D; --green-text: #1F7A35; --red: #FF3B30; --red-text: #D70015;
  --blue: #007AFF; --indigo: #5856D6; --purple: #AF52DE; --pink: #FF2D55; --teal: #30B0C7; --yellow: #FFCC00; --brown: #A2845E; --gray: #8E8E93;
  --glass: rgba(255,255,255,.74); --glass-edge: rgba(255,255,255,.75); --glass-line: rgba(0,0,0,.06);
  --glass-shadow: 0 10px 30px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
  --edge-fade: rgba(242,242,247,.92);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --r-group: 26px; --r-card: 26px; --gutter: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --card-2: #2C2C2E; --label: #FFFFFF; --label-2: rgba(235,235,245,.62); --label-3: rgba(235,235,245,.34);
  --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.36); --fill-2: rgba(120,120,128,.32); --fill-3: rgba(118,118,128,.24); --press: #3A3A3C;
  --tint: #FF9F0A; --tint-text: #FF9F0A; --on-tint: #000000;
  --green: #30D158; --green-ui: #30D158; --green-text: #30D158; --red: #FF453A; --red-text: #FF6961;
  --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2; --pink: #FF375F; --teal: #40C8E0; --yellow: #FFD60A; --brown: #AC8E68; --gray: #8E8E93;
  --glass: rgba(37,37,40,.74); --glass-edge: rgba(255,255,255,.14); --glass-line: rgba(255,255,255,.06);
  --glass-shadow: 0 10px 30px rgba(0,0,0,.5);
  --edge-fade: rgba(0,0,0,.9); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --card-2: #2C2C2E; --label: #FFFFFF; --label-2: rgba(235,235,245,.62); --label-3: rgba(235,235,245,.34);
  --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.36); --fill-2: rgba(120,120,128,.32); --fill-3: rgba(118,118,128,.24); --press: #3A3A3C;
  --tint: #FF9F0A; --tint-text: #FF9F0A; --on-tint: #000000;
  --green: #30D158; --green-ui: #30D158; --green-text: #30D158; --red: #FF453A; --red-text: #FF6961;
  --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2; --pink: #FF375F; --teal: #40C8E0; --yellow: #FFD60A; --brown: #AC8E68; --gray: #8E8E93;
  --glass: rgba(37,37,40,.74); --glass-edge: rgba(255,255,255,.14); --glass-line: rgba(255,255,255,.06);
  --glass-shadow: 0 10px 30px rgba(0,0,0,.5);
  --edge-fade: rgba(0,0,0,.9); color-scheme: dark; }
@media (prefers-contrast: more) { :root { --label-2: var(--label); --sep: rgba(60,60,67,.6); --glass: var(--card); } }

/* Dynamic Type: on iPhone -apple-system-body follows the user's text size setting (17px at default). Everything below scales in rem. */
html { font: -apple-system-body; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 1rem; line-height: 1.3; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; text-align: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 12px; }
svg { flex: none; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
/* HIG text styles */
.t-large { font-size: 2rem; font-weight: 700; line-height: 1.2; letter-spacing: .01em; }
.t-title2 { font-size: 1.294rem; font-weight: 700; line-height: 1.27; }
.t-title3 { font-size: 1.176rem; font-weight: 600; line-height: 1.25; }
.t-head { font-size: 1rem; font-weight: 600; }
.t-sub { font-size: .882rem; line-height: 1.33; }
.t-foot { font-size: .765rem; line-height: 1.38; }
.t-cap { font-size: .706rem; line-height: 1.33; }
.l2 { color: var(--label-2); }
.tint { color: var(--tint-text); }

.app { max-width: 600px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 0 calc(118px + env(safe-area-inset-bottom, 0px)); }

/* Navigation bar: glass buttons always; small title + scroll-edge blur appear once the large title scrolls away */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: 56px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); display: flex; align-items: center; gap: 10px; }
.nav::before { content: ''; position: absolute; inset: 0 0 -14px; background: linear-gradient(var(--edge-fade) 55%, transparent); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: -1; }
.nav.scrolled::before { opacity: 1; }
.nav .small { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 1rem; opacity: 0; transition: opacity .2s; white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.nav.scrolled .small { opacity: 1; }
.nav.scrolled .gbtn .num { display: none; }
.nav.scrolled .gbtn { padding-inline: 0; width: 44px; }
.nav .sp { flex: 1; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: .5px solid var(--glass-edge); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge); }
.gbtn { min-width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding-inline: 11px; font-weight: 600; font-size: .882rem; color: var(--label); }
.gbtn svg { width: 22px; height: 22px; }
.gbtn:active { transform: scale(.94); }
.gbtn .num { font-weight: 700; font-size: .941rem; }

.head { padding-block: 2px 14px; }
.head .t-large { margin: 0; }
.head .t-sub { margin-top: 2px; }
.view { display: flex; flex-direction: column; gap: 22px; }

/* Inset grouped list */
.sec { display: flex; flex-direction: column; gap: 7px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; padding-inline: 16px; margin: 0; font-size: 1rem; font-weight: 600; color: var(--label-2); }
.sec-h .act { margin-left: auto; color: var(--tint-text); font-weight: 400; font-size: 1rem; min-height: 44px; display: inline-flex; align-items: center; margin-block: -14px; }
.sec-f { margin: 0; padding-inline: 16px; font-size: .765rem; color: var(--label-2); line-height: 1.38; }
.group { background: var(--card); border-radius: var(--r-group); overflow: hidden; }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 9px 16px; width: 100%; text-align: left; }
.row + .row::before, .row + .rowx::before, .rowx + .row::before { content: ''; position: absolute; top: 0; right: 0; left: var(--sep-l, 16px); border-top: .5px solid var(--sep); }
.row.has-tile { --sep-l: 60px; }
button.row:active, .row-main:active { background: var(--press); }
.row-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; align-self: stretch; margin: -9px 0 -9px -16px; padding: 9px 0 9px 16px; text-align: left; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-size: 1rem; line-height: 1.24; }
.row-sub { font-size: .882rem; color: var(--label-2); line-height: 1.3; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-trail { color: var(--label-2); font-size: 1rem; text-align: right; flex: none; display: flex; align-items: center; gap: 6px; }
.row-trail .num { color: var(--label); font-weight: 600; }
.chev { width: 9px; height: 15px; color: var(--label-3); flex: none; }
.row-trail .tint svg { width: 22px; height: 22px; display: block; }
.tile { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--c, var(--gray)); flex: none; }
.tile svg { width: 20px; height: 20px; }
.row.done .row-title { color: var(--label-2); }
.row.skip .row-title { color: var(--label-2); text-decoration: line-through; }
/* check (iOS checkmark.circle.fill) */
.ck { width: 44px; height: 44px; margin: -6px -8px -6px 0; display: grid; place-items: center; flex: none; border-radius: 50%; }
.ck i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--label-3); display: grid; place-items: center; transition: background .15s, border-color .15s, transform .2s; }
.ck svg { width: 16px; height: 16px; color: #fff; opacity: 0; }
.ck[aria-pressed="true"] i { background: var(--green-ui); border-color: var(--green-ui); }
.ck[aria-pressed="true"] svg { opacity: 1; }
.ck.pop i { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
.tag { font-size: .706rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--fill-3); color: var(--label); white-space: nowrap; }
.tag.late { background: rgba(255,59,48,.11); color: var(--red-text); }
.tag.next { background: rgba(255,149,0,.18); color: var(--tint-text); }
.tag.ok { background: rgba(52,199,89,.16); color: var(--green-text); }

/* Cards */
.card { background: var(--card); border-radius: var(--r-card); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 50px; padding: 0 22px; border-radius: 25px; font-size: 1rem; font-weight: 600; background: var(--fill-3); color: var(--tint-text); white-space: nowrap; }
.btn.pri { background: var(--tint); color: var(--on-tint); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: .941rem; border-radius: 22px; }
.btn.block { width: 100%; }
.btn svg { width: 19px; height: 19px; }
.btn:active { opacity: .7; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* Hero: activity ring */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 136px; height: 136px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--fill-3); }
.ring .val { stroke: var(--tint); transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.ring .over { stroke: var(--green); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .c b { font-family: var(--font-num); font-weight: 700; font-size: 1.76rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .c span { font-size: .706rem; color: var(--label-2); margin-top: 4px; }
.hero.win .ring { animation: win .9s ease 1; }
@keyframes win { 35% { transform: scale(1.05); } }
.stat .l { display: flex; justify-content: space-between; gap: 8px; font-size: .765rem; color: var(--label-2); }
.stat .l b { font-family: var(--font-num); color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
.pbar { height: 6px; border-radius: 3px; background: var(--fill-3); overflow: hidden; margin-top: 5px; }
.pbar i { display: block; height: 100%; border-radius: 3px; background: var(--label); transition: width .5s; }
.pbar.green i { background: var(--green); }
.pbar.tint i { background: var(--tint); }
.hstats { display: flex; flex-direction: column; gap: 11px; min-width: 0; }

/* Now card */
.now { display: flex; flex-direction: column; gap: 12px; }
.now .eye { font-size: .765rem; font-weight: 600; color: var(--tint-text); display: flex; align-items: center; gap: 8px; }
.now.late .eye { color: var(--red-text); }
.now .eye .tile { width: 26px; height: 26px; border-radius: 7px; }
.now .eye .tile svg { width: 16px; height: 16px; }

/* Day strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 14px; }
.dayb { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; padding-top: 2px; border-radius: 14px; }
.dayb small { font-size: .706rem; color: var(--label-2); font-weight: 500; }
.dayb b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 600; font-size: 1.06rem; font-variant-numeric: tabular-nums; }
.dayb.today b { color: var(--tint-text); }
.dayb[aria-current="date"] b { background: var(--label); color: var(--bg); }
.dayb.today[aria-current="date"] b { background: var(--tint); color: var(--on-tint); }
.dayb i { width: 5px; height: 5px; border-radius: 50%; }
.dayb i.part { background: var(--tint); }
.dayb i.full { background: var(--green); }
.dayb.off { opacity: .4; }

/* Segmented control (capsule, iOS 26) */
.seg { display: flex; background: var(--fill-3); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 44px; padding: 0 8px; border-radius: 99px; font-size: .882rem; font-weight: 500; white-space: nowrap; text-align: center; }
.seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }

/* Switch (UISwitch 51×31) */
.sw { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; transition: background .2s; flex: none; margin: 0; cursor: pointer; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: transform .25s cubic-bezier(.3,1.3,.5,1); }
.sw:checked { background: var(--green-ui); }
.sw:checked::after { transform: translateX(20px); }

/* Inputs */
.field-in { flex: 1; min-width: 0; font: inherit; font-size: 1rem; border: 0; background: none; color: var(--label); text-align: right; padding: 0; outline: none; }
.field-in::placeholder { color: var(--label-3); }
.sel { font: inherit; font-size: 1rem; border: 0; background: none; color: var(--label-2); text-align: right; text-align-last: right; padding: 0 2px; -webkit-appearance: none; appearance: none; max-width: 62%; }
.wbox { display: flex; align-items: center; gap: 10px; }
.wbox .inp { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; background: var(--fill-3); border-radius: 14px; padding: 6px 14px; }
.wbox input { flex: 1; min-width: 0; width: 100%; font-family: var(--font-num); font-weight: 700; font-size: 1.65rem; font-variant-numeric: tabular-nums; border: 0; background: none; color: var(--label); outline: none; padding: 0; }
.wbox .inp span { color: var(--label-2); }
.wbox .inp:focus-within { box-shadow: 0 0 0 2px var(--tint); }

/* Goal */
.bignum { font-family: var(--font-num); font-weight: 700; font-size: 2.47rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.gtrack { position: relative; height: 10px; border-radius: 5px; background: var(--fill-3); margin: 16px 0 6px; overflow: hidden; }
.gtrack i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--tint); }
.gends { display: flex; justify-content: space-between; font-size: .706rem; color: var(--label-2); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .765rem; color: var(--label-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 18px; height: 8px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpis .v { font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpis .l { font-size: .706rem; color: var(--label-2); }
.del { width: 44px; height: 44px; margin: -6px 0 -6px -8px; display: grid; place-items: center; flex: none; }
.del i { width: 22px; height: 22px; border-radius: 50%; background: var(--red); display: grid; place-items: center; }
.del i::after { content: ''; width: 11px; height: 2.5px; border-radius: 2px; background: #fff; }
.weekhdr { display: flex; align-items: center; gap: 8px; }
.weekhdr .mid { flex: 1; text-align: center; min-width: 0; }
.weekhdr .mid b { display: block; font-size: 1rem; font-weight: 600; }
.weekhdr .mid span { font-size: .765rem; color: var(--label-2); }
.gbtn:disabled { opacity: .35; }
.notice { display: flex; gap: 12px; align-items: flex-start; }
.notice .tile { margin-top: 1px; }
.notice p { margin: 0; font-size: .882rem; line-height: 1.38; }
.list { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .882rem; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; position: relative; display: flex; gap: 12px; padding: 12px 16px; font-size: 1rem; line-height: 1.38; }
.steps li + li::before { content: ''; position: absolute; top: 0; right: 0; left: 52px; border-top: .5px solid var(--sep); }
.steps li::after { content: counter(s); order: -1; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--fill-3); display: grid; place-items: center; font-size: .765rem; font-weight: 700; margin-top: 1px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .765rem; font-weight: 600; padding: 6px 11px; border-radius: 99px; background: var(--fill-3); }
.chip.tint { background: var(--tint); color: var(--on-tint); }
.stepper { display: inline-flex; align-items: center; background: var(--fill-3); border-radius: 99px; height: 44px; }
.stepper button { width: 44px; height: 44px; display: grid; place-items: center; font-size: 1.2rem; font-weight: 500; }
.stepper span { min-width: 64px; text-align: center; font-size: .882rem; font-weight: 600; }
.stepper i { width: .5px; height: 18px; background: var(--sep); }

/* Floating Liquid Glass tab bar (inset 21pt from sides and bottom) */
.tabbar { position: fixed; left: 21px; right: 21px; bottom: calc(env(safe-area-inset-bottom, 0px) + 21px); z-index: 40; max-width: 520px; margin: 0 auto; border-radius: 34px; padding: 5px; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 56px; border-radius: 28px; font-size: .647rem; font-weight: 500; color: var(--label); letter-spacing: 0; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button[aria-current="page"] { background: var(--fill-3); color: var(--tint-text); font-weight: 600; }
@media (max-width: 370px) { .tabbar { left: 12px; right: 12px; } .tabbar button { font-size: .6rem; } }

/* Sheet: inset with concentric corners while partial, grabber, glass close button */

.scrim.open { opacity: 1; }

function chartSvg(ent0) {

  for (let y = Math.ceil(ymin / 5) * 5; y <= ymax; y += 5) g.push(`<line x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--sep)" stroke-width=".6"/><text x="${L - 6}" y="${Y(y) + 4}" text-anchor="end" font-size="11" fill="var(--label-2)">${y}</text>`);
  g.push(`<line x1="${L}" x2="${W - R}" y1="${Y(g0)}" y2="${Y(g0)}" stroke="var(--green)" stroke-dasharray="2 3"/><text x="${L + 4}" y="${Y(g0) - 5}" font-size="11" font-weight="700" fill="var(--green-text)">cíl ${g0} kg</text>`);
  const ti = idxOf(todayKey()); if (ti >= 0 && ti <= 91) g.push(`<line x1="${X(ti)}" x2="${X(ti)}" y1="${T + 10}" y2="${H - B}" stroke="var(--sep)"/><text x="${X(ti)}" y="${T + 6}" text-anchor="middle" font-size="11" fill="var(--label-2)">dnes</text>`);
  for (const wk of [0, 28, 56, 84]) g.push(`<text x="${X(wk)}" y="${H - 6}" text-anchor="${wk === 0 ? 'start' : 'middle'}" font-size="11" fill="var(--label-2)">${shortDate(addDays(S.settings.start, wk))}</text>`);
  g.push(`<path d="${proj.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="var(--label-2)" stroke-width="1.6" stroke-dasharray="4 3"/>`);
  for (const p of ent) g.push(`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" fill="var(--label)" opacity=".35"/>`);
  if (ent.length >= 2) {
    const avg = ent.map(([i]) => { const xs = ent.filter(q => q[0] <= i && q[0] > i - 7).map(q => q[1]); return [i, xs.reduce((a, b) => a + b, 0) / xs.length]; });
    g.push(`<path d="${avg.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="var(--tint)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>`);
    const lp = avg[avg.length - 1]; g.push(`<circle cx="${X(lp[0])}" cy="${Y(lp[1])}" r="5" fill="var(--tint)" stroke="var(--card)" stroke-width="2"/><text x="${Math.min(X(lp[0]) + 8, W - R - 30)}" y="${Y(lp[1]) + 16}" font-size="11" font-weight="700" fill="var(--label)">${kg1(lp[1])}</text>`);
  }
  const end = proj[proj.length - 1]; g.push(`<text x="${X(end[0])}" y="${Y(end[1]) + 15}" text-anchor="end" font-size="11" fill="var(--label-2)">~${kg1(end[1])} kg</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf váhy proti plánu">${g.join('')}</svg>`;
}
function gainBars(gains) {
  const W = 320, H = 130, T = 16, B = 22, hi = Math.max(2, ...gains.map(g => g[1])), lo = Math.min(-0.4, ...gains.map(g => g[1]));
  const n = Math.max(gains.length, 6), bw = Math.min(30, (W - 20) / n - 8), gap = (W - n * bw) / n, Y = v => T + (hi - v) / (hi - lo) * (H - T - B), zero = Y(0);

// ---------- Notifikace (Web Push přes Supabase edge funkci) ----------
const PUSH_FN = SB_URL + '/functions/v1/plan70-push', PUSH_LS = LS_KEY + '.push';

function pushOnHere() { try { return !!localStorage.getItem(PUSH_LS) && Notification.permission === 'granted'; } catch (e) { return false; } }

async function pushCall(op) {
  const r = await sbFetch(`${PUSH_FN}?op=${op}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-plan70-key': SY.key }, body: '{}' });
  if (!r.ok) throw new Error('push ' + r.status);
  return r.json();
}
async function enablePush() {
  if (!SY.key) { toast('Nejdřív propoj zálohu klíčem'); return; }
  if (!pushSupported()) { toast('Tenhle prohlížeč notifikace neumí'); return; }
  if (navigator.onLine === false) { toast('Na zapnutí notifikací potřebuješ internet'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifikace nejsou povolené'); settingsSheet(); return; }
  try {
    toast('Zapínám notifikace…');
    const { publicKey } = await pushCall('vapid');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub) { try { await sub.unsubscribe(); } catch (e) { } }
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(publicKey) });
    const j = sub.toJSON(), id = await pushId(j.endpoint);
    localStorage.setItem(PUSH_LS, id);
    persist('push/' + id, { endpoint: j.endpoint, keys: j.keys, ua: navigator.userAgent.slice(0, 120), created: new Date().toISOString() });
    await syncNow();
    await pushCall('test');
    toast('Hotovo, poslal jsem zkušební notifikaci');
  } catch (e) { console.warn('push', e); toast('Notifikace se nepodařilo zapnout'); }
  if (!document.getElementById('sheet').hidden) settingsSheet();
}

    if (sub) { const id = await pushId(sub.endpoint); persist('push/' + id, { endpoint: sub.endpoint, off: true }); await sub.unsubscribe(); }
  } catch (e) { console.warn('push off', e); }
  try { localStorage.removeItem(PUSH_LS); } catch (e) { }

}

  } else if (f.matches('[data-form="waist"]')) {
    const val = num(f.querySelector('.wwaist').value); if (!(val > 40 && val < 150)) { toast('Zadej obvod v cm, třeba 68,5'); return; }
    S.body = { ...S.body, waist: { ...(S.body.waist || {}), [todayKey()]: Math.round(val * 10) / 10 } }; persist('app/body', S.body); document.activeElement && document.activeElement.blur(); render(); toast('Pas uložen');
  } else if (f.matches('[data-form="train"]')) {
    const k = UI.date, ex = {};
    TRAINING.gym.forEach((x, i) => { const sets = []; for (let j = 0; j < x.sets; j++) { const kgv = num((f.elements['kg-' + i + '-' + j] || {}).value), rv = num((f.elements['r-' + i + '-' + j] || {}).value); if (kgv > 0 && rv > 0) sets.push({ kg: Math.round(kgv * 10) / 10, r: Math.round(rv) }); } if (sets.length) ex[i] = sets; });
    S.training = { ...S.training, [k]: { ex } }; persist('training/' + k, { ex }); closeSheet(); render(); toast(Object.keys(ex).length ? 'Trénink uložen' : 'Nic nevyplněno');
  } else if (f.matches('[data-form="pantry"]')) {
    const i = document.getElementById('p-i').value, q = num(document.getElementById('p-q').value);
    if (!ING[i] || q == null || q < 0) { toast('Zadej množství'); return; }
    adjStock({ [i]: q - (stock()[i] || 0) }); closeSheet(); render(); toast('Spíž upravena');
  } else if (f.matches('[data-form="custom"]')) {
    const n = (document.getElementById('cx-n').value || '').trim(), kcv = num(document.getElementById('cx-k').value), bv = num(document.getElementById('cx-b').value) || 0;
    if (!n || !(kcv > 0)) { toast('Vyplň název a kalorie'); return; }
    const k = UI.date, r = dayRec(k); r.extras.push({ c: { n: n.slice(0, 80), kcal: Math.round(kcv), b: Math.round(bv) }, t: k === todayKey() ? minLabel(nowMin()) : '' }); saveDay(k, r); closeSheet(); render(); toast('Přidáno');
  } else if (f.matches('[data-form="ask"]')) runAsk();
  else if (f.matches('[data-form="sync"]')) runSyncKey();
});
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('wkg')) UI.wDraft = e.target.value; });
document.addEventListener('change', async e => {
  const id = e.target.id, val = e.target.value;
  if (id === 's-start' && val) { const k = addDays(val, -dowOf(val)); e.target.value = k; saveSettings({ start: k }); }
  else if (id === 's-wake') saveSettings({ wake: val });
  else if (id === 's-gym') saveSettings({ gym: Number(val) });
  else if (id === 's-add') saveSettings({ add: Number(val) });
  else if (id === 's-bomb') { const st = { ...S.settings, bomb: val }; saveSettings({ bomb: val, bombHist: { ...(S.settings.bombHist || {}), [curWeek()]: bombEffective(st) } }); settingsSheet(); toast(bombEffective(st) ? 'Kalorická bomba zapnutá' : 'Kalorická bomba vypnutá'); }
  else if (id === 'n-meals' || id === 'n-late') { const n = { meals: true, late: true, ...(S.settings.notify || {}) }; n[id === 'n-meals' ? 'meals' : 'late'] = e.target.checked; saveSettings({ notify: n }); }
  else if (id === 's-auto' || id === 'autot') saveSettings({ auto: e.target.checked });
  else if (id === 's-kg') { const x = num(val); if (x > 30 && x < 200) saveSettings({ startKg: Math.round(x * 10) / 10 }); }
  else if (id === 's-goal') { const x = num(val); if (x > 40 && x < 150) saveSettings({ goalKg: Math.round(x * 10) / 10 }); }
  else if (id === 's-gdate' && val) saveSettings({ goalDate: val });
  else if (id === 'hideb') { UI.hideBought = e.target.checked; try { localStorage.setItem(LS_KEY + '.hide', UI.hideBought ? '1' : '0'); } catch (er) { } render(); }
  else if (id === 'quick') { const k = UI.date, r = dayRec(k); r.quick = e.target.checked; saveDay(k, r); e.target.blur(); render(); toast(r.quick ? 'Rychlý den zapnut' : 'Rychlý den vypnut'); }
  else if (id === 'bloodsw') { S.body = { ...S.body, blood: e.target.checked ? { done: true, date: todayKey() } : null }; persist('app/body', S.body); e.target.blur(); render(); }
  else if (id === 'p-i') { const u = document.getElementById('p-u'); if (u) u.textContent = ING[val].u; }
  else if (id === 'ask-photo') { const l = document.getElementById('ask-ph-l'); if (l && e.target.files[0]) l.textContent = 'Fotka vybrána: ' + e.target.files[0].name.slice(0, 30); }
  else if (id === 'photo-in') {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    toast('Ukládám fotku…');
    try {
      const blob = await shrinkImage(file), id = 'ph-' + todayKey() + '-' + Date.now().toString(36);
      await PH.put(id, blob);
      const old = (S.body.photos || {})[todayKey()]; if (old) PH.del(old).catch(() => { });
      S.body = { ...S.body, photos: { ...(S.body.photos || {}), [todayKey()]: id } }; saveLocal(); render(); toast('Fotka uložena');
    } catch (er) { console.warn(er); toast('Fotku se nepodařilo uložit'); }
  }
});
document.addEventListener('focusout', () => { setTimeout(() => { const a = document.activeElement; if (pendingRender && document.getElementById('sheet').hidden && !(a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA'))) render(); }, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
let tx = null, ty = null;
for (const id of ['view', 'head']) {
  document.getElementById(id).addEventListener('touchstart', e => { if (UI.tab !== 'dnes' || e.touches.length !== 1 || e.target.closest('input,textarea,.seg')) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  document.getElementById(id).addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null; if (Math.abs(dx) > 70 && Math.abs(dy) < 45) setDate(addDays(UI.date, (dx < 0 ? 1 : -1) * (id === 'head' ? 7 : 1))); }, { passive: true });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) return; const t = todayKey(); if (UI.lastToday && UI.lastToday !== t && UI.date === UI.lastToday) UI.date = t; UI.lastToday = t; if (ready.st && ready.w && ready.d) { autoCheck(); schedulePlanSync(); } render(); scheduleSync(0); });
setInterval(() => { if (!document.hidden && UI.tab === 'dnes' && document.getElementById('sheet').hidden && !(document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName))) render(); }, 60000);

loadLocal(); UI.lastToday = todayKey(); render(); connect();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e)); }); }
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => { }); }
