/* Layout: iOS 26 app shell per Apple HIG — large title that collapses into a glass nav bar, inset-grouped lists (26pt corners, 52pt rows, 16pt margins),

  --tint: #FF9500; --tint-text: #C93400; --on-tint: #000000;
  --green: #34C759; --green-ui: #248A3D; --green-text: #1F7A35; --red: #FF3B30; --red-text: #D70015;
  --blue: #007AFF; --indigo: #5856D6; --purple: #AF52DE; --pink: #FF2D55; --teal: #30B0C7; --yellow: #FFCC00; --brown: #A2845E; --gray: #8E8E93;

  --glass-shadow: 0 10px 30px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);

  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --r-group: 26px; --r-card: 26px; --gutter: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --card-2: #2C2C2E; --label: #FFFFFF; --label-2: rgba(235,235,245,.62); --label-3: rgba(235,235,245,.34);
  --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.36); --fill-2: rgba(120,120,128,.32); --fill-3: rgba(118,118,128,.24); --press: #3A3A3C;
  --tint: #FF9F0A; --tint-text: #FF9F0A; --on-tint: #000000;
  --green: #30D158; --green-ui: #30D158; --green-text: #30D158; --red: #FF453A; --red-text: #FF6961;
  --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2; --pink: #FF375F; --teal: #40C8E0; --yellow: #FFD60A; --brown: #AC8E68; --gray: #8E8E93;

/* Dynamic Type: on iPhone -apple-system-body follows the user's text size setting (17px at default). Everything below scales in rem. */
html { font: -apple-system-body; touch-action: manipulation; }
/* ťuknutí není výběr textu ani podržení s nabídkou; pole mají aspoň 16 px, jinak iPhone při psaní přiblíží stránku */
button, .row, .tabbar, .dayb, .chip, .tag, .pbtn, .seg, .ck, .tile, .gbtn { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 1rem; line-height: 1.3; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; text-align: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 12px; }
svg { flex: none; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
/* HIG text styles */
.t-large { font-size: 2rem; font-weight: 700; line-height: 1.2; letter-spacing: .01em; }
.t-title2 { font-size: 1.294rem; font-weight: 700; line-height: 1.27; }
.t-title3 { font-size: 1.176rem; font-weight: 600; line-height: 1.25; }
.t-head { font-size: 1rem; font-weight: 600; }
.t-sub { font-size: .882rem; line-height: 1.33; }
.t-foot { font-size: .765rem; line-height: 1.38; }
.t-cap { font-size: .706rem; line-height: 1.33; }
.l2 { color: var(--label-2); }
.tint { color: var(--tint-text); }

.app { max-width: 600px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 0 calc(var(--dock-bottom) + 98px); }

/* Navigation bar: glass buttons always; small title + scroll-edge blur appear once the large title scrolls away */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: 56px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); display: flex; align-items: center; gap: 10px; }
.nav::before { content: ''; position: absolute; inset: 0 0 -14px; background: linear-gradient(var(--edge-fade) 55%, transparent); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: -1; }
.nav.scrolled::before { opacity: 1; }
.nav .small { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 1rem; opacity: 0; transition: opacity .2s; white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.nav.scrolled .small { opacity: 1; }
.nav.scrolled .gbtn .num { display: none; }
.nav.scrolled .gbtn { padding-inline: 0; width: 44px; }
.nav .sp { flex: 1; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: .5px solid var(--glass-edge); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge); }
.gbtn { min-width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding-inline: 11px; font-weight: 600; font-size: .882rem; color: var(--label); }
.gbtn svg { width: 22px; height: 22px; }
.gbtn:active { transform: scale(.94); }
.gbtn .num { font-weight: 700; font-size: .941rem; }

.head { padding-block: 2px 14px; }
.head .t-large { margin: 0; }
.head .t-sub { margin-top: 2px; }
.view { display: flex; flex-direction: column; gap: 22px; }

/* Inset grouped list */
.sec { display: flex; flex-direction: column; gap: 7px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; padding-inline: 16px; margin: 0; font-size: 1rem; font-weight: 600; color: var(--label-2); }
.sec-h .act { margin-left: auto; color: var(--tint-text); font-weight: 400; font-size: 1rem; min-height: 44px; display: inline-flex; align-items: center; margin-block: -14px; }
.sec-f { margin: 0; padding-inline: 16px; font-size: .765rem; color: var(--label-2); line-height: 1.38; }
.group { background: var(--card); border-radius: var(--r-group); overflow: hidden; }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 9px 16px; width: 100%; text-align: left; }
.row + .row::before, .row + .rowx::before, .rowx + .row::before { content: ''; position: absolute; top: 0; right: 0; left: var(--sep-l, 16px); border-top: .5px solid var(--sep); }
.row.has-tile { --sep-l: 60px; }
button.row:active, .row-main:active { background: var(--press); }
.row-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; align-self: stretch; margin: -9px 0 -9px -16px; padding: 9px 0 9px 16px; text-align: left; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-size: 1rem; line-height: 1.24; }
.row-sub { font-size: .882rem; color: var(--label-2); line-height: 1.3; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-trail { color: var(--label-2); font-size: 1rem; text-align: right; flex: none; display: flex; align-items: center; gap: 6px; }
.row-trail .num { color: var(--label); font-weight: 600; }
.chev { width: 9px; height: 15px; color: var(--label-3); flex: none; }
.row-trail .tint svg { width: 22px; height: 22px; display: block; }
.tile { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--c, var(--gray)); flex: none; }
.tile svg { width: 20px; height: 20px; }
.row.done .row-title { color: var(--label-2); }
.row.skip .row-title { color: var(--label-2); text-decoration: line-through; }
/* check (iOS checkmark.circle.fill) */
.ck { width: 44px; height: 44px; margin: -6px -8px -6px 0; display: grid; place-items: center; flex: none; border-radius: 50%; }
.ck i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--label-3); display: grid; place-items: center; transition: background .15s, border-color .15s, transform .2s; }
.ck svg { width: 16px; height: 16px; color: #fff; opacity: 0; }
.ck[aria-pressed="true"] i { background: var(--green-ui); border-color: var(--green-ui); }
.ck[aria-pressed="true"] svg { opacity: 1; }
.ck.pop i { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
.tag { font-size: .706rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--fill-3); color: var(--label); white-space: nowrap; }
.tag.late { background: rgba(255,59,48,.11); color: var(--red-text); }
.tag.next { background: rgba(255,149,0,.18); color: var(--tint-text); }
.tag.ok { background: rgba(52,199,89,.16); color: var(--green-text); }

/* Cards */
.card { background: var(--card); border-radius: var(--r-card); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 50px; padding: 0 22px; border-radius: 25px; font-size: 1rem; font-weight: 600; background: var(--fill-3); color: var(--tint-text); white-space: nowrap; }
.btn.pri { background: var(--tint); color: var(--on-tint); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: .941rem; border-radius: 22px; }
.btn.block { width: 100%; }
.btn svg { width: 19px; height: 19px; }
.btn:active { opacity: .7; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* Hero: activity ring */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 136px; height: 136px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--fill-3); }
.ring .val { stroke: var(--tint); transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.ring .over { stroke: var(--green); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .c b { font-family: var(--font-num); font-weight: 700; font-size: 1.76rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .c span { font-size: .706rem; color: var(--label-2); margin-top: 4px; }
.hero.win .ring { animation: win .9s ease 1; }
@keyframes win { 35% { transform: scale(1.05); } }
.stat .l { display: flex; justify-content: space-between; gap: 8px; font-size: .765rem; color: var(--label-2); }
.stat .l b { font-family: var(--font-num); color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
.pbar { height: 6px; border-radius: 3px; background: var(--fill-3); overflow: hidden; margin-top: 5px; }
.pbar i { display: block; height: 100%; border-radius: 3px; background: var(--label); transition: width .5s; }
.pbar.green i { background: var(--green); }
.pbar.tint i { background: var(--tint); }
.hstats { display: flex; flex-direction: column; gap: 11px; min-width: 0; }

/* Now card */
.now { display: flex; flex-direction: column; gap: 12px; }
.now .eye { font-size: .765rem; font-weight: 600; color: var(--tint-text); display: flex; align-items: center; gap: 8px; }
.now.late .eye { color: var(--red-text); }
.now .eye .tile { width: 26px; height: 26px; border-radius: 7px; }
.now .eye .tile svg { width: 16px; height: 16px; }

.now-main { display: flex; flex-direction: column; gap: 3px; text-align: left; margin: -4px -6px; padding: 4px 6px; border-radius: 14px; }
.now-main:active { background: var(--press); }
.now-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-weight: 600; }
.now-link .chev { color: currentColor; width: 7px; height: 12px; }
.now .btns .btn { flex: 1 1 auto; padding: 0 16px; }
.now .btns .btn.pri { flex-grow: 1.6; }
.portions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pbtn { min-height: 64px; border-radius: 18px; background: var(--fill-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; }
.pbtn b { font-size: 1.18rem; font-weight: 700; }
.pbtn span { font-size: .706rem; color: var(--label-2); }
.pbtn[aria-pressed="true"] { background: var(--tint); color: var(--on-tint); }
.pbtn[aria-pressed="true"] span { color: inherit; opacity: .9; }
.pbtn:active { transform: scale(.96); }
.capbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.capbtn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 20px; background: var(--card); font-weight: 600; font-size: .941rem; color: var(--tint-text); }
.capbtn svg { width: 22px; height: 22px; flex: none; }
.capbtn:active { transform: scale(.97); }
.scanbox { position: relative; border-radius: 24px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
.scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-aim { position: absolute; left: 10%; right: 10%; top: 30%; bottom: 30%; border: 3px solid rgba(255,255,255,.92); border-radius: 16px; box-shadow: 0 0 0 999px rgba(0,0,0,.28); }
.scan-aim::after { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; border-radius: 1px; background: #ff453a; animation: scanl 1.4s ease-in-out infinite alternate; }
@keyframes scanl { from { transform: translateY(-30px); } to { transform: translateY(30px); } }
.stepn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: .882rem; color: var(--label); background: color-mix(in srgb, var(--purple) 20%, transparent); }
.aithumb { width: 100%; max-height: 210px; object-fit: cover; border-radius: 22px; display: block; }
.spin { width: 22px; height: 22px; flex: none; border: 3px solid var(--fill-3); border-top-color: var(--tint); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .scan-aim::after { animation: none; } .spin { animation-duration: 2.4s; } }
.addc { width: 26px; height: 26px; border-radius: 50%; background: var(--tint); color: var(--on-tint); display: grid; place-items: center; }
.addc svg { width: 15px; height: 15px; }
/* Day strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 14px; }
.dayb { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; padding-top: 2px; border-radius: 14px; }
.dayb small { font-size: .706rem; color: var(--label-2); font-weight: 500; }
.dayb b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 600; font-size: 1.06rem; font-variant-numeric: tabular-nums; }
.dayb.today b { color: var(--tint-text); }
.dayb[aria-current="date"] b { background: var(--label); color: var(--bg); }
.dayb.today[aria-current="date"] b { background: var(--tint); color: var(--on-tint); }
.dayb i { width: 5px; height: 5px; border-radius: 50%; }
.dayb i.part { background: var(--tint); }
.dayb i.full { background: var(--green); }
.dayb.off { opacity: .4; }

/* Segmented control (capsule, iOS 26) */
.seg { display: flex; background: var(--fill-3); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 44px; padding: 0 8px; border-radius: 99px; font-size: .882rem; font-weight: 500; white-space: nowrap; text-align: center; }
.seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }

/* Switch (UISwitch 51×31) */
.sw { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; transition: background .2s; flex: none; margin: 0; cursor: pointer; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: transform .25s cubic-bezier(.3,1.3,.5,1); }
.sw:checked { background: var(--green-ui); }
.sw:checked::after { transform: translateX(20px); }

/* Inputs */
.field-in { flex: 1; min-width: 0; font: inherit; font-size: 1rem; border: 0; background: none; color: var(--label); text-align: right; padding: 0; outline: none; }
.field-in::placeholder { color: var(--label-3); }
.sel { font: inherit; font-size: 1rem; border: 0; background: none; color: var(--label-2); text-align: right; text-align-last: right; padding: 0 2px; -webkit-appearance: none; appearance: none; max-width: 62%; }
.wbox { display: flex; align-items: center; gap: 10px; }
.wbox .inp { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; background: var(--fill-3); border-radius: 14px; padding: 6px 14px; }
.wbox input { flex: 1; min-width: 0; width: 100%; font-family: var(--font-num); font-weight: 700; font-size: 1.65rem; font-variant-numeric: tabular-nums; border: 0; background: none; color: var(--label); outline: none; padding: 0; }
.wbox .inp span { color: var(--label-2); }
.wbox .inp:focus-within { box-shadow: 0 0 0 2px var(--tint); }

/* Goal */
.bignum { font-family: var(--font-num); font-weight: 700; font-size: 2.47rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

function plural(n, one, few, many) { n = Math.abs(n); return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }
function fmtNum(x, d = 0) { return x.toLocaleString('cs-CZ', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtAmt(q, u) {
  if (u === 'g') return q >= 1000 ? fmtNum(q / 1000, q % 1000 ? 1 : 0) + ' kg' : fmtNum(Math.round(q)) + ' g';
  if (u === 'ml') return q >= 1000 ? fmtNum(q / 1000, q % 1000 ? 1 : 0) + ' l' : fmtNum(Math.round(q)) + ' ml';
  if (q > 0 && q < 1 && Math.abs(q * 4 - Math.round(q * 4)) < 1e-6) return ({ 1: '¼', 2: '½', 3: '¾' })[Math.round(q * 4)] + ' ks';
  return fmtNum(Math.ceil(q - 1e-9)) + ' ks';
}
const STATS_CACHE = {};
function mealStats(id, mult = 1) {
  const key = id + '|' + mult; if (STATS_CACHE[key]) return { ...STATS_CACHE[key] };
  const m = MEALS[id]; let kcal = 0, b = 0, kc = 0;
  for (const [k, q] of m.ing) {
    const i = ING[k]; const f = (i.u === 'ks' ? q : q / 100) * mult;
    kcal += i.kcal * f; b += i.b * f; kc += i.price * q * mult;
  }
  STATS_CACHE[key] = { kcal, b, kc };
  return { kcal, b, kc };
}

const PUSH_FN = SB_URL + '/functions/v1/plan70-push', PUSH_LS = LS_KEY + '.push';
function pushSupported() { return typeof window !== 'undefined' && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function isStandalone() { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function pushOnHere() { try { return !!localStorage.getItem(PUSH_LS) && Notification.permission === 'granted'; } catch (e) { return false; } }
function b64uToU8(b) { const s = atob(b.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b.length + 3) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function pushId(endpoint) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint)); return [...new Uint8Array(h)].slice(0, 8).map(x => x.toString(16).padStart(2, '0')).join(''); }
async function pushCall(op) {
  const r = await sbFetch(`${PUSH_FN}?op=${op}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-plan70-key': SY.key }, body: '{}' });
  if (!r.ok) throw new Error('push ' + r.status);
  return r.json();
}
async function enablePush() {
  if (!SY.key) { toast('Nejdřív propoj zálohu klíčem'); return; }
  if (!pushSupported()) { toast('Tenhle prohlížeč notifikace neumí'); return; }
  if (navigator.onLine === false) { toast('Na zapnutí notifikací potřebuješ internet'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifikace nejsou povolené'); settingsSheet(); return; }
  try {
    toast('Zapínám notifikace…');
    const { publicKey } = await pushCall('vapid');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub) { try { await sub.unsubscribe(); } catch (e) { } }
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(publicKey) });
    const j = sub.toJSON(), id = await pushId(j.endpoint);
    localStorage.setItem(PUSH_LS, id);
    persist('push/' + id, { endpoint: j.endpoint, keys: j.keys, ua: navigator.userAgent.slice(0, 120), created: new Date().toISOString() });
    await syncNow();
    await pushCall('test');
    toast('Hotovo, poslal jsem zkušební notifikaci');
  } catch (e) { console.warn('push', e); toast('Notifikace se nepodařilo zapnout'); }
  if (!document.getElementById('sheet').hidden) settingsSheet();
}
async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { const id = await pushId(sub.endpoint); persist('push/' + id, { endpoint: sub.endpoint, off: true }); await sub.unsubscribe(); }
  } catch (e) { console.warn('push off', e); }
  try { localStorage.removeItem(PUSH_LS); } catch (e) { }
  toast('Notifikace v tomto zařízení vypnuté'); settingsSheet();
}

document.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender) flushRender(); }, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'f-q') { e.preventDefault(); const q = e.target.value.trim(); e.target.blur(); if (q.length >= 2) lkStart(q); return; } UI.kbd = e.key === 'Tab' || UI.kbd; if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
document.addEventListener('pointerdown', () => { UI.kbd = false; }, { passive: true, capture: true });
let tx = null, ty = null, tt = 0;
for (const id of ['view', 'head']) { // tah prstem do strany přepne den (v hlavičce týden); jen jasně vodorovný a rychlý, ať se nesplete s rolováním
  document.getElementById(id).addEventListener('touchstart', e => { tx = null; if (UI.tab !== 'dnes' || e.touches.length !== 1 || sheetOpen() || e.target.closest('input,textarea,select,.seg,.fchips,.portions')) return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); }, { passive: true });
  document.getElementById(id).addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty, dt = Date.now() - tt; tx = null; if (Math.abs(dx) > 70 && Math.abs(dx) > 2.2 * Math.abs(dy) && dt < 700) setDate(addDays(UI.date, (dx < 0 ? 1 : -1) * (id === 'head' ? 7 : 1))); }, { passive: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && clPending() && !sheetOpen()) setTimeout(() => { if (clPending() && !sheetOpen()) clWaitSheet(false); }, 450); });
document.addEventListener('visibilitychange', () => { if (document.hidden) return; const t = todayKey(); if (UI.lastToday && UI.lastToday !== t && UI.date === UI.lastToday) UI.date = t; UI.lastToday = t; if (ready.st && ready.w && ready.d) { autoCheck(); schedulePlanSync(); } render(); scheduleSync(0); });
setInterval(() => { if (!document.hidden && UI.tab === 'dnes') requestRender(); }, 60000); // „za 2 h“ a zpoždění se mění s časem

// ---------- Klidné překreslování ----------
// Stránka se přestavuje celá (innerHTML). Kdyby se to stalo pod prstem, ťuknutí se ztratí a rolování cukne,
// proto se překreslení odkládá, dokud se prstem pracuje, roluje, píše nebo je otevřený panel.
const TOUCH = { n: 0, last: 0 };
let flushT = null, syncSig = '';
addEventListener('touchstart', e => { TOUCH.n = e.touches.length; TOUCH.last = Date.now(); }, { passive: true, capture: true });
for (const ev of ['touchend', 'touchcancel']) addEventListener(ev, e => { TOUCH.n = e.touches.length; TOUCH.last = Date.now(); }, { passive: true, capture: true });
addEventListener('scroll', () => { TOUCH.last = Date.now(); }, { passive: true });
function uiBusy() { return TOUCH.n > 0 || Date.now() - TOUCH.last < 1200; }
function fieldFocused() { const a = document.activeElement; return !!a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName); }
function requestRender() {
  if (fieldFocused() || sheetOpen() || uiBusy()) { pendingRender = true; clearTimeout(flushT); flushT = setTimeout(flushRender, 1300); return; }
  render();
}
function flushRender() {
  if (!pendingRender || fieldFocused() || sheetOpen()) return; // dořeší to opuštění pole nebo zavření panelu
  if (uiBusy()) { clearTimeout(flushT); flushT = setTimeout(flushRender, 700); return; }
  render();
}
function syncSigNow() { return [!!SY.key, !!SY.bad, dbState === 'badkey'].join(); }
function softSync() { // jen stav synchronizace: přepiš řádek, celou stránku jen když se mění, co je na ní vidět
  if (syncSigNow() !== syncSig) { requestRender(); return; }
  const el = document.getElementById('synctxt'); if (el) el.textContent = syncText();
}

// ---------- Panel: drží stránku na místě, zavírá se stažením, uhýbá klávesnici ----------
let sheetT = null, SG = null;
function sheetEls() { return [document.getElementById('sheet'), document.getElementById('scrim')]; }
function sgStart(e) {
  if (!sheetOpen() || e.touches.length !== 1) { SG = null; return; }
  const t = e.touches[0], [sh] = sheetEls();
  SG = { x: t.clientX, y: t.clientY, inSheet: sh.contains(e.target), field: !!e.target.closest('input,textarea,select'), hs: e.target.closest('.fchips'), decided: false, block: false, drag: false, dy: 0, v: 0, t: e.timeStamp };
}
function sgMove(e) {
  if (!SG || !sheetOpen()) return;
  const t = e.touches[0], dx = t.clientX - SG.x, dy = t.clientY - SG.y, [sh, sc] = sheetEls();
  if (!SG.decided) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) { if (e.cancelable && !SG.inSheet) e.preventDefault(); return; }
    SG.decided = true;
    const top = sh.scrollTop <= 0, bottom = sh.scrollTop + sh.clientHeight >= sh.scrollHeight - 1;
    if (!SG.inSheet) SG.block = true; // šero kolem panelu: stránka pod ním se nehne
    else if (Math.abs(dx) > Math.abs(dy)) SG.block = !SG.hs; // do strany smí jen vodorovná řada filtrů
    else if (dy > 0 && top) { SG.block = true; SG.drag = !SG.field; } // nahoře táhne dolů: panel jede s prstem
    else if (dy < 0 && bottom) SG.block = true; // na konci obsahu: dál už nic, ani stránka pod panelem
    if (SG.drag) { sh.style.transition = 'none'; sc.style.transition = 'none'; }
  }
  if (SG.block && e.cancelable) e.preventDefault();
  if (SG.drag) {
    const d = Math.max(0, dy), dt = Math.max(1, e.timeStamp - SG.t);
    SG.v = (d - SG.dy) / dt; SG.dy = d; SG.t = e.timeStamp;
    sh.style.transform = `translateY(${d}px)`; sc.style.opacity = String(Math.max(0, 1 - d / (sh.offsetHeight || 1)));
  }
}
function sgEnd() {
  if (!SG) return; const g = SG; SG = null;
  if (!g.drag) return;
  const [sh, sc] = sheetEls();
  if (g.dy > 120 || (g.dy > 30 && g.v > 0.55)) { closeSheet(); return; } // dost daleko, nebo švihnutí
  sh.style.transition = ''; sc.style.transition = ''; void sh.offsetHeight; sh.style.transform = ''; sc.style.opacity = '';
}
function sheetGestures(on) { // posluchače dotyku visí jen s otevřeným panelem, jinak by brzdily rolování stránky
  const f = on ? 'addEventListener' : 'removeEventListener';
  document[f]('touchstart', sgStart, { passive: true });
  document[f]('touchmove', sgMove, { passive: false });
  document[f]('touchend', sgEnd, { passive: true });
  document[f]('touchcancel', sgEnd, { passive: true });
}
function fitSheet() { // klávesnice: panel stojí nad ní a vejde se do toho, co z obrazovky zbylo
  const vv = window.visualViewport, root = document.documentElement.style; if (!vv) return;
  const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  root.setProperty('--kb', kb + 'px'); root.setProperty('--vvh', Math.round(vv.height) + 'px');
  const a = document.activeElement, [sh] = sheetEls();
  if (kb > 80 && a && sh.contains(a) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) requestAnimationFrame(() => {
    const r = a.getBoundingClientRect(), s = sh.getBoundingClientRect();
    if (r.bottom > s.bottom - 16) sh.scrollTop += r.bottom - s.bottom + 16; else if (r.top < s.top + 56) sh.scrollTop -= s.top + 56 - r.top;
  });
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }

// ---------- Aktualizace appky ----------
// Při každém otevření (i návratu do appky) se porovná verze se serverem; je-li novější, appka se sama přenačte.
const UPD = { reg: null, busy: false, pending: false, hadCtl: false, checked: null };
function safeToReload() { const a = document.activeElement; return document.getElementById('sheet').hidden && !(a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)); }
async function applyUpdate() {
  if (UPD.busy) return; UPD.busy = true;
  try {
    if (UPD.reg) await Promise.race([UPD.reg.update().catch(() => { }), sleep(4000)]);
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith('plan70-')).map(k => caches.delete(k))); }
  } catch (e) { }
  try { sessionStorage.setItem(LS_KEY + '.updated', APP_VERSION); } catch (e) { }
  location.reload();
}
async function checkVersion(manual) {
  if (navigator.onLine === false) { if (manual) toast('Jsi offline, zkus to s internetem'); return; }
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('version ' + r.status);
    const j = await r.json(); UPD.checked = new Date().toISOString();
    if (j.v && j.v !== APP_VERSION) {
      let tried = null; try { tried = sessionStorage.getItem(LS_KEY + '.tried'); sessionStorage.setItem(LS_KEY + '.tried', j.v); } catch (e) { }
      if (tried === j.v && !manual) return; // jednou za otevření, ať se to nezacyklí
      if (manual || safeToReload()) { if (manual) toast('Stahuji novou verzi…'); applyUpdate(); } else UPD.pending = true;
    } else if (manual) { toast('Máš nejnovější verzi'); if (!document.getElementById('sheet').hidden) settingsSheet(); }
  } catch (e) { if (manual) toast('Nepodařilo se ověřit, zkus to za chvíli'); }
}
function verLabel() { const d = new Date(APP_BUILT); return isNaN(d) ? APP_VERSION : `${d.getDate()}. ${d.getMonth() + 1}. ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function aboutSec() {
  return sec('O appce', `<div class="row has-tile">${tile('info', 'gray')}<span class="row-text"><span class="row-title">Verze z ${verLabel()}</span><span class="row-sub">${APP_VERSION}${UPD.checked ? ' · ověřeno ' + agoLabel(UPD.checked) : ''}</span></span></div>
    <button class="row has-tile" data-act="checkupd">${tile('spark', 'blue')}<span class="row-text"><span class="row-title tint">Zkontrolovat aktualizaci</span></span></button>`,
    'Appka se aktualizuje sama, když ji otevřeš s internetem. Data zůstanou, jsou v telefonu i v záloze.');
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act="checkupd"]'); if (b) checkVersion(true); });
setInterval(() => { if (UPD.pending && safeToReload()) { UPD.pending = false; applyUpdate(); } }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (UPD.reg) UPD.reg.update().catch(() => { }); checkVersion(false); } });

loadLocal(); UI.lastToday = todayKey(); render(); connect();
try { if (sessionStorage.getItem(LS_KEY + '.updated')) { sessionStorage.removeItem(LS_KEY + '.updated'); setTimeout(() => toast('Appka je aktualizovaná'), 600); } } catch (e) { }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  UPD.hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!UPD.hadCtl) { UPD.hadCtl = true; return; } if (safeToReload()) applyUpdate(); else UPD.pending = true; });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { UPD.reg = r; r.update().catch(() => { }); }).catch(e => console.warn('sw', e)); });
}
setTimeout(() => checkVersion(false), 1500);
setInterval(() => { if (!document.hidden) checkVersion(false); }, 30 * 60000);
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => { }); }
setTimeout(() => { if (clPending() && !sheetOpen()) clWaitSheet(false); }, 900); // appka se mezitím na pozadí restartovala

</script>
